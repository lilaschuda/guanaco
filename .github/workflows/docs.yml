name: Deploy Javadoc to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Disable Java problem matcher for expected background-thread exceptions
        run: echo "::remove-matcher owner=java::"

      - name: Generate Javadoc & KDoc
        run: mvn -B clean package javadoc:aggregate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './target/reports/apidocs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
